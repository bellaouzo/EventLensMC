dev-mode: false

reports:
  retention-days: 30
  auto-cleanup: true

dashboard:
  enabled: true
  port: 8765
  bind-address: 127.0.0.1
  # Required (12+ characters) to bind beyond localhost. Leave empty for 127.0.0.1 only.
  token: ""

output:
  detail-level: normal

trace:
  slow-threshold-default: 1ms
  additional-events: []
  require-hot-event-confirmation: true
  show-performance-warnings: true
  auto-baseline-compare: ""
  live:
    aggregate-window-ms: 3000
    burst-window-ms: 5000
    burst-threshold: 50
    max-lines-per-tick: 8
    default-status-display: actionbar
  presets:
    dev-debug:
      max-duration-ms: 120000
      max-events: 256
      slow-threshold-ns: 500000
      capture-stacks: true
    quick-interact:
      max-duration-ms: 30000
      max-events: 128
      slow-threshold-ns: 1000000
    plugin-focus:
      capture-stacks: false
    block-flow:
      max-duration-ms: 60000
      max-events: 256
      events:
        - PlayerInteractEvent
        - BlockBreakEvent
        - BlockPlaceEvent
    inventory-flow:
      max-duration-ms: 60000
      max-events: 256
      events:
        - InventoryClickEvent
        - InventoryOpenEvent
        - InventoryCloseEvent
        - InventoryDragEvent
    chat-flow:
      max-duration-ms: 60000
      max-events: 128
      events:
        - AsyncChatEvent
    protection-flow:
      max-duration-ms: 60000
      max-events: 256
      events:
        - PlayerInteractEvent
        - BlockBreakEvent
        - BlockPlaceEvent
        - EntityChangeBlockEvent
        - SignChangeEvent
    plugin-watch:
      max-duration-ms: 60000
      max-events: 256
      events:
        - PlayerInteractEvent
        - BlockBreakEvent
        - BlockPlaceEvent
        - EntityChangeBlockEvent
        - SignChangeEvent
    login-flow:
      max-duration-ms: 60000
      max-events: 128
      events:
        - AsyncPlayerPreLoginEvent
        - PlayerLoginEvent
        - PlayerJoinEvent
    command-flow:
      max-duration-ms: 60000
      max-events: 128
      events:
        - PlayerCommandPreprocessEvent
        - ServerCommandEvent

preferences:
  max-recent-traces: 20
  max-favorites: 32
