pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        maven {
            name = 'neoforged'
            url = 'https://maven.neoforged.net/releases'
        }
        maven {
            name = 'fabricmc'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'minecraftforge'
            url = 'https://maven.minecraftforge.net/'
        }
    }
}

rootProject.name = 'EventLens'

include(
        'eventlens-core',
        'eventlens-paper',
        'eventlens-observability',
        'eventlens-agent',
        'eventlens-client-agent',
        'eventlens-testkit',
        'eventlens-mod-common',
        'eventlens-neoforge',
        'eventlens-forge',
        'eventlens-fabric'
)

dependencyResolutionManagement {
