plugins {
    id 'com.diffplug.spotless' version '8.9.0'
    id 'name.remal.sonarlint' version '7.1.5' apply false
    id 'net.ltgt.errorprone' version '4.3.0' apply false
}

group = 'dev.bellaouzo'
version = '1.2.4'

ext {
    resolveFileLengthLimit = { String relPath, String fileName ->
        if (relPath.contains('/test/') && fileName.endsWith('Test.java')) {
            return [max: 400, category: 'test class']
        }
        if (fileName == 'EventLens.java' || fileName == 'EventLensMod.java') {
            return [max: 100, category: 'mod or plugin entry']
        }
        if (relPath.contains('/command/') && fileName == 'EventLensCommand.java') {
            return [max: 150, category: 'command router']
        }
        if (relPath.contains('/command/')) {
            return [max: 200, category: 'command handler or formatter']
        }
        if (relPath.contains('/application/') || relPath.contains('/modcommon/')) {
            return [max: 250, category: 'application service']
        }
        if (relPath.contains('/domain/')) {
            return [max: 300, category: 'domain type or engine']
        }
        if (relPath.contains('/paper/') || relPath.contains('/neoforge/') || relPath.contains('/forge/') || relPath.contains('/fabric/')) {
            return [max: 250, category: 'platform adapter or listener']
        }
        if (relPath.contains('/trace/')) {
            return [max: 250, category: 'trace session lifecycle']
        }
        return [max: 300, category: 'Java source']
    }
}

subprojects { subproject ->
    subproject.plugins.withId('java') {
        subproject.group = rootProject.group
        subproject.version = rootProject.version
    }
}

spotless {
    format 'misc', {
        target 'README.md', 'AGENTS.md', 'CHANGELOG.md', 'docs/**/*.md'
        trimTrailingWhitespace()
        endWithNewline()
    }
}

tasks.named('check') {
    dependsOn subprojects.collect { it.path + ':check' }
}

tasks.named('build') {
    dependsOn subprojects.collect { it.path + ':build' }
}

tasks.register('paperSmokeTest') {
    group = 'verification'
    description = 'Delegates to eventlens-paper paperSmokeTest.'
    dependsOn ':eventlens-paper:paperSmokeTest'
}

tasks.register('runServer') {
    group = 'run'
    description = 'Delegates to eventlens-paper runServer.'
    dependsOn ':eventlens-paper:runServer'
}

tasks.register('runServerDebug') {
    group = 'run'
    description = 'Delegates to eventlens-paper runServerDebug.'
    dependsOn ':eventlens-paper:runServerDebug'
}

tasks.register('buildDashboard') {
    group = 'build'
    description = 'Delegates to eventlens-paper buildDashboard.'
    dependsOn ':eventlens-paper:buildDashboard'
}

tasks.register('stopRunServer') {
    group = 'run'
    description = 'Delegates to eventlens-paper stopRunServer.'
    dependsOn ':eventlens-paper:stopRunServer'
}

tasks.register('runNeoForgeClient') {
    group = 'run'
    description = 'Delegates to eventlens-neoforge runClient.'
    dependsOn ':eventlens-neoforge:runClient'
}

tasks.register('runForgeClient') {
    group = 'run'
    description = 'Delegates to eventlens-forge runClient (Minecraft Forge).'
    dependsOn ':eventlens-forge:runClient'
}

tasks.register('runFabricClient') {
    group = 'run'
    description = 'Delegates to eventlens-fabric runClient.'
    dependsOn ':eventlens-fabric:runClient'
}
