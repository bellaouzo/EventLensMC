name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build artifacts
        run: |
          chmod +x ./gradlew
          ./gradlew assemble --no-daemon --warning-mode all

      - name: Stage artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          export VERSION
          mkdir -p dist "dist/manual/EventLens-${VERSION}-manual"
          cp "eventlens-setup/build/libs/eventlens-setup-${VERSION}.jar" dist/
          for f in \
            "eventlens-paper/build/libs/EventLens-${VERSION}.jar" \
            "eventlens-agent/build/libs/eventlens-agent-${VERSION}.jar" \
            "eventlens-client-agent/build/libs/eventlens-client-agent-${VERSION}.jar" \
            "eventlens-observability/build/libs/eventlens-observability-${VERSION}.jar" \
            "eventlens-neoforge/build/libs/eventlens-neoforge-${VERSION}.jar" \
            "eventlens-forge/build/libs/eventlens-forge-${VERSION}.jar" \
            "eventlens-fabric/build/libs/eventlens-fabric-${VERSION}.jar"
          do
            cp "$f" "dist/manual/EventLens-${VERSION}-manual/"
          done
          python3 - <<'PY'
          import os
          from pathlib import Path
          from textwrap import dedent
          version = os.environ["VERSION"]
          text = dedent(f"""\
          EventLens {version} — manual install

          Paper plugin:  EventLens-{version}.jar → plugins/
          Paper agent:   eventlens-agent-{version}.jar → JVM args (not plugins/)
          NeoForge:      eventlens-neoforge-{version}.jar → mods/
          Forge:         eventlens-forge-{version}.jar → mods/
          Fabric:        eventlens-fabric-{version}.jar → mods/
          Client agent:  eventlens-client-agent-{version}.jar → launcher JVM args (not mods/)
          Optional:      eventlens-observability-{version}.jar beside an agent (fat agents work alone)

          Prefer the wizard? Download eventlens-setup-{version}.jar from the same GitHub release.
          The wizard needs Java 21+ (OpenJDK / Temurin). Do not open it with Java SE Platform Binary (Java 8).

          Full steps:  https://github.com/bellaouzo/EventLensMC#install
          JVM args:    https://github.com/bellaouzo/EventLensMC#java-agents-optional
          """)
          Path(f"dist/manual/EventLens-{version}-manual/INSTALL.txt").write_text(text, encoding="utf-8")
          PY
          (cd dist/manual && zip -r "../EventLens-${VERSION}-manual.zip" "EventLens-${VERSION}-manual")
          rm -rf dist/manual
          ls -la dist/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          export VERSION
          NOTES="$(python3 - <<'PY'
          from pathlib import Path
          import os
          version = os.environ["VERSION"].removeprefix("v")
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          heading = f"## [{version}]"
          start = text.find(heading)
          if start < 0:
              print(f"See CHANGELOG.md for {version}.")
              raise SystemExit(0)
          rest = text[start:]
          nxt = rest.find("\n## [", 1)
          section = rest if nxt < 0 else rest[:nxt]
          print("## Downloads")
          print()
          print(f"- **Setup wizard (start here):** `eventlens-setup-{version}.jar`")
          print("- Needs **Java 21+ OpenJDK** (Temurin / Microsoft OpenJDK). Not **Java SE Platform Binary** (Java 8).")
          print(f"- **Manual install folder:** `EventLens-{version}-manual.zip`")
          print()
          print(section.strip())
          PY
          )"
          ARGS=(release create "$GITHUB_REF_NAME" dist/* --title "EventLens ${VERSION}" --notes "$NOTES")
          if [[ "$VERSION" == *beta* ]]; then
            ARGS+=(--prerelease)
          fi
          gh "${ARGS[@]}"
