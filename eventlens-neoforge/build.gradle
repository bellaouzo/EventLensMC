plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.144'
}

evaluationDependsOn(':eventlens-mod-common')
evaluationDependsOn(':eventlens-core')
evaluationDependsOn(':eventlens-client-agent')

group = 'dev.bellaouzo'
version = rootProject.version

base {
    archivesName = 'eventlens-neoforge'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

neoForge {
    version = neo_version

    runs {
        client {
            client()
            jvmArguments.add(clientAgentArgument())
        }
    }

    mods {
        eventlens {
            sourceSet sourceSets.main
            sourceSet project(':eventlens-mod-common').sourceSets.main
            sourceSet project(':eventlens-core').sourceSets.main
        }
    }
}

dependencies {
    implementation project(':eventlens-mod-common')
    compileOnly project(':eventlens-observability')
    jarJar project(':eventlens-mod-common')
    jarJar project(':eventlens-core')
    jarJar project(':eventlens-observability')
}

def clientAgentArgument() {
    return project.provider {
        def agentJar = project(':eventlens-client-agent').tasks.named('jar', Jar).get().archiveFile.get().asFile
        "-javaagent:${agentJar.absolutePath}"
    }
}

tasks.configureEach { task ->
    if (task.name == 'runClient' || task.name == 'prepareClient') {
        task.dependsOn ':eventlens-client-agent:jar', ':eventlens-observability:jar'
    }
}

var generateModMetadata = tasks.register('generateModMetadata', Copy) {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : rootProject.version,
    ]
    inputs.properties replaceProperties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
    expand replaceProperties
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

tasks.register('checkFileLengths') {
    group = 'verification'
    def srcDir = layout.projectDirectory.dir('src')
    def projectDir = layout.projectDirectory.asFile
    doLast {
        def violations = []
        fileTree(srcDir) { include '**/java/**/*.java' }.each { File file ->
            int lines = file.readLines().size()
            String relPath = projectDir.toPath().relativize(file.toPath()).toString().replace('\\', '/')
            def limit = rootProject.ext.resolveFileLengthLimit(relPath, file.name)
            if (lines > limit.max) {
                violations << [relPath, lines, limit.max, limit.category]
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException("File length check failed: ${violations.size()} file(s)")
        }
    }
}

tasks.named('check') {
    dependsOn 'checkFileLengths'
}
