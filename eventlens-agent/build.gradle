plugins {
    id 'java'
}

group = 'dev.bellaouzo'
version = rootProject.version

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

dependencies {
    implementation project(':eventlens-observability')
    implementation 'net.bytebuddy:byte-buddy:1.17.5'
    implementation 'net.bytebuddy:byte-buddy-agent:1.17.5'

    compileOnly "io.papermc.paper:paper-api:${paperApiVersion}"

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

def observabilityJarPath = project(':eventlens-observability').layout.buildDirectory.file(
        "libs/${project(':eventlens-observability').name}-${project.version}.jar")

tasks.register('stageObservabilityJar', Copy) {
    dependsOn ':eventlens-observability:jar'
    from observabilityJarPath
    into layout.buildDirectory.dir('libs')
}

tasks.named('jar', Jar) {
    dependsOn ':eventlens-observability:jar', tasks.named('stageObservabilityJar')

    manifest {
        attributes(
                'Premain-Class': 'dev.bellaouzo.eventlens.agent.EventLensAgent',
                'Can-Redefine-Classes': 'false',
                'Can-Retransform-Classes': 'true',
                'Implementation-Title': 'EventLens Agent',
                'Implementation-Version': project.version)
    }

    from {
        configurations.runtimeClasspath.collect { entry ->
            entry.isDirectory() ? entry : zipTree(entry)
        }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
